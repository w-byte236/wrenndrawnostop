<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paper Studio</title>

    <link rel="stylesheet" href="https://use.typekit.net/crl3nff.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="viewport">

    <div class="scene">

     <!-- ========================= -->
     <!-- Furniture -->
     <!-- ========================= -->

     <img src="HOMEPAGE/table.png" class="table">

     <img src="HOMEPAGE/chair.png" class="chair">
     
     <img src="HOMEPAGE/legs.png" class="legs clickable" data-title="Me">

     <img src="HOMEPAGE/HAND.png"
     class="hand clickable"
     data-title="Collaborate">

     <img src="HOMEPAGE/Ble.png" class="bubble ble">
     
     <img src="HOMEPAGE/Right.png" class="bubble right">
     
     <img src="HOMEPAGE/Ble2.png" class="bubble ble2">
     
     <img src="HOMEPAGE/Left.png" class="bubble left">


     <!-- ========================= -->
     <!-- Books -->
     <!-- ========================= -->

     <div id="book1" 
     class="book" 
     data-page="project1"
     data-title='Project 1 - "The Sting of Death"'>
         <img src="HOMEPAGE/BOOK/B1c.png" class="closed">
         <img src="HOMEPAGE/BOOK/B1o.png" class="open">
         
     </div>
 
     <div id="book2" 
     class="book" 
     data-page="project2"
     data-title="Project 2 - The Golden Key">
         <img src="HOMEPAGE/BOOK/B2c.png" class="closed">
         <img src="HOMEPAGE/BOOK/B2o.png" class="open">
     </div>

     <div id="book3" 
     class="book" 
     data-page="project3"
     data-title="Project 3 - The Gleam of Hunger">
         <img src="HOMEPAGE/BOOK/B3c.png" class="closed">
         <img src="HOMEPAGE/BOOK/B3o.png" class="open">
     </div>

     <div id="bookD" 
     class="book" 
     data-page="projectD"
     data-title="Project 0 - That day when I woke up">
         <img src="HOMEPAGE/BOOK/BDc.png" class="closed">
     </div>
 
     <div id="sketchbook"
     class="book"
     data-page="sketchbook"
     data-title="Sketchbook">
         <img src="HOMEPAGE/BOOK/SKETCHBOOK.png" class="closed">
     </div>
 
     <div id="littleman"
     class="book"
     data-page="littleman"
     data-title="Project 4 - The Little Man">
         <img src="HOMEPAGE/BOOK/thelittleman.png" class="closed">
         
         <img src="HOMEPAGE/BOOK/TLMOPEN.png" class="open">
     </div>


     <!-- ========================= -->
     <!-- Art Supplies -->
     <!-- ========================= -->

     <img src="HOMEPAGE/OILPASTEL.png" 
     class="oilpastel clickable"
     data-title="Oil Pastel Works">

     <img src="HOMEPAGE/pastel.png" 
     class="pastel clickable"
     data-title="Soft Pastel Works">

    <img src="HOMEPAGE/watercolour.png" 
     class="watercolour clickable"
     data-title="Watercolour Works">
 
     <img src="HOMEPAGE/waterpen.png" class="waterpen clickable">

     <img src="HOMEPAGE/PENCIL.png"
     class="pencil clickable"
     data-title="Pencil Work">

     <img src="HOMEPAGE/bottle.png" class="bottle clickable">


     <!-- ========================= -->
     <!-- Contact -->
     <!-- ========================= -->

     <img src="HOMEPAGE/MAIL.png"
     class="mail clickable"
     data-title="Email Address">

     <img src="HOMEPAGE/COMPUTER.png"
     class="computer clickable"
     data-title="Digital Works">


     <!-- ========================= -->
     <!-- Speech Bubbles -->
     <!-- ========================= -->

     <img src="HOMEPAGE/BUBBLEHUGE.png" class="bubble huge">
 
     <img src="HOMEPAGE/BUBBLEMID.png" class="bubble mid">

     <img src="HOMEPAGE/BUBBLESMALL.png" class="bubble small">

     <div class="tooltip"></div>

     </div>

 </div>

<script src="script.js"></script>

</body>

</html>
